name: DevSecOps pipeline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with: {config: p/python}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s
          framework: kubernetes
          skip_check: CKV_K8S_14,CKV_K8S_43
  # Runs on pull_request too so Trivy findings block the merge (see the
  # merge-gate table in the README), not just pushes to main.
  image:
    needs: [unit-tests, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Build image (push on main, load locally on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
      - name: Sign image (keyless, push events only)
        uses: sigstore/cosign-installer@v3.8.1
        if: github.event_name == 'push'
      - name: cosign sign
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}', format: sarif, output: trivy.sarif, severity: 'CRITICAL,HIGH', ignore-unfixed: true}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy.sarif') != ''
        with: {sarif_file: trivy.sarif}
